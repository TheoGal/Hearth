# Builds the Hearth IPK on every push to main (and on demand) and publishes it as a GitHub Release.
# Fork-only file: Hearth upstream has no such workflow, so syncing the fork never conflicts with it.
name: Build IPK

on:
  push:
    branches: [main]
    # Everything except docs and markdown, but language files under docs/languages/packs are bundled into the app.
    paths:
      - '**'
      - '!docs/**'
      - '!mkdocs.yml'
      - '!**.md'
      - 'docs/languages/packs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ipk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and package
        run: npm run package

      - name: Read version
        id: meta
        run: |
          VERSION=$(node -p "require('./public/appinfo.json').version")
          IPK=$(ls build/*.ipk)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "ipk=$IPK" >> "$GITHUB_OUTPUT"

      - name: Keep the IPK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hearth-${{ steps.meta.outputs.version }}
          path: ${{ steps.meta.outputs.ipk }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          # Same version built again (a change of your own, no new Hearth version): the old release and tag
          # are replaced, so there is always one release per version, pointing at the newest build.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git push origin ":refs/tags/$TAG"
          fi
          gh release create "$TAG" "${{ steps.meta.outputs.ipk }}" \
            --target "$GITHUB_SHA" \
            --title "Hearth ${{ steps.meta.outputs.version }}" \
            --notes "Automatic build of commit ${GITHUB_SHA::7}: $(git log -1 --format=%s)" \
            --latest
